version: "2"

sql:
  - engine: "sqlite"
    schema: "./repository/migrations"
    queries: "./repository/queries"
    gen:
      go:
        emit_json_tags: true
        package: "repository"
        out: "repository/database"
        sql_package: "pgx/v5"
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"
